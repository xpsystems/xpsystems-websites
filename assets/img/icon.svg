<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .xps-icon-bg { fill: #0a0c14; stroke: #1e2436; stroke-width: 2px; }
      .xps-icon-x1 { stroke: #3b82f6; stroke-width: 12px; stroke-linecap: round; stroke-linejoin: round; }
      .xps-icon-p  { stroke: #2563eb; stroke-width: 12px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .xps-icon-x2 { stroke: #38bdf8; stroke-width: 12px; stroke-linecap: round; stroke-linejoin: round; }
      .xps-icon-node { fill: #10b981; }
      @media (prefers-color-scheme: light) {
        .xps-icon-bg { fill: #ffffff; stroke: #cbd5e1; }
        .xps-icon-x1 { stroke: #2563eb; }
        .xps-icon-p  { stroke: #1d4ed8; }
        .xps-icon-x2 { stroke: #0284c7; }
      }
    </style>
  </defs>
  <rect class="xps-icon-bg" x="4" y="4" width="120" height="120" rx="28"/>
  <g>
    <!-- Left X chevron -->
    <path class="xps-icon-x1" d="M34 38L58 64L34 90"/>
    <!-- P vertical stem -->
    <path class="xps-icon-p" d="M58 34V94"/>
    <!-- P loop -->
    <path class="xps-icon-p" d="M58 34H80C89.94 34 98 42.06 98 52C98 61.94 89.94 70 80 70H58"/>
    <!-- X lower right kick -->
    <path class="xps-icon-x2" d="M66 72L92 92"/>
    <!-- Technical Status Node -->
    <circle class="xps-icon-node" cx="80" cy="52" r="4.5"/>
  </g>
</svg>