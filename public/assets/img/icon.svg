<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .xps-bg { fill: #0b0f19; stroke: #1e293b; stroke-width: 2px; }
      .xps-blade-1 { stroke: #3b82f6; }
      .xps-blade-2 { stroke: #0ea5e9; }
      .xps-p-loop { stroke: #2563eb; fill: none; }
      .xps-dot { fill: #10b981; }
      .xps-dot-ring { stroke: #10b981; stroke-width: 2px; stroke-opacity: 0.35; fill: none; }
      @media (prefers-color-scheme: light) {
        .xps-bg { fill: #ffffff; stroke: #e2e8f0; }
        .xps-blade-1 { stroke: #2563eb; }
        .xps-blade-2 { stroke: #0284c7; }
        .xps-p-loop { stroke: #1d4ed8; }
      }
    </style>
  </defs>

  <!-- Squircle Base -->
  <rect class="xps-bg" x="4" y="4" width="120" height="120" rx="30"/>

  <!-- Geometric Monogram: X + P -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left X chevron (top arm) -->
    <path class="xps-blade-1" d="M34 38L62 66" stroke-width="13"/>

    <!-- Left X chevron (bottom arm) -->
    <path class="xps-blade-2" d="M34 94L62 66" stroke-width="13"/>

    <!-- Center vertical P spine -->
    <path class="xps-p-loop" d="M62 34V94" stroke-width="13"/>

    <!-- Top-Right P loop -->
    <path class="xps-p-loop" d="M62 34H84C93.94 34 102 42.06 102 52C102 61.94 93.94 70 84 70H62" stroke-width="13"/>

    <!-- Bottom-Right X diagonal kick -->
    <path class="xps-blade-2" d="M68 72L94 94" stroke-width="13"/>
  </g>

  <!-- Active European Anycast Node Pulse -->
  <circle class="xps-dot-ring" cx="83" cy="52" r="7"/>
  <circle class="xps-dot" cx="83" cy="52" r="4"/>
</svg>