<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .logo-icon-bg { fill: #0a0c14; stroke: #1e2436; stroke-width: 1.5px; }
      .logo-icon-x1 { stroke: #3b82f6; stroke-width: 12px; stroke-linecap: round; stroke-linejoin: round; }
      .logo-icon-p  { stroke: #2563eb; stroke-width: 12px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .logo-icon-x2 { stroke: #38bdf8; stroke-width: 12px; stroke-linecap: round; stroke-linejoin: round; }
      .logo-icon-node { fill: #10b981; }
      .logo-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.045em;
        fill: #0f172a;
      }
      .logo-dot { fill: #2563eb; }
      @media (prefers-color-scheme: dark) {
        .logo-icon-bg { fill: #0a0c14; stroke: #1e2436; }
        .logo-text { fill: #f8fafc; }
        .logo-dot { fill: #38bdf8; }
      }
      @media (prefers-color-scheme: light) {
        .logo-icon-bg { fill: #ffffff; stroke: #cbd5e1; }
        .logo-icon-x1 { stroke: #2563eb; }
        .logo-icon-p  { stroke: #1d4ed8; }
        .logo-icon-x2 { stroke: #0284c7; }
      }
    </style>
  </defs>
  <!-- Left Icon Emblem (48x48) -->
  <g transform="translate(6, 8) scale(0.375)">
    <rect class="logo-icon-bg" x="4" y="4" width="120" height="120" rx="28"/>
    <g>
      <path class="logo-icon-x1" d="M34 38L58 64L34 90"/>
      <path class="logo-icon-p" d="M58 34V94"/>
      <path class="logo-icon-p" d="M58 34H80C89.94 34 98 42.06 98 52C98 61.94 89.94 70 80 70H58"/>
      <path class="logo-icon-x2" d="M66 72L92 92"/>
      <circle class="logo-icon-node" cx="80" cy="52" r="4.5"/>
    </g>
  </g>
  <!-- Typography -->
  <text x="66" y="44" class="logo-text">xpsystems<tspan class="logo-dot">.</tspan></text>
</svg>